spring.application.name=user-document-storage-api
spring.output.ansi.enabled=ALWAYS
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Springdoc OpenAPI Configuration
springdoc.api-docs.enabled=true

# Cache configuration
# File listing: cache first-page results for 60 seconds, max 500 entries
cache.file-list.ttl-seconds=60
cache.file-list.max-size=500

# Presigned download URLs: shorter TTL than S3's 15-min URL expiry to avoid serving stale links
cache.presigned-download-url.ttl-seconds=600
cache.presigned-download-url.max-size=1000
