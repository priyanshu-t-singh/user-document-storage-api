# Import the default application.properties file
spring.config.import=classpath:application.properties

# S3 Configuration
storage.s3.bucket-name=${AWS_BUCKET_NAME:user-document-storage}
storage.s3.key-prefix=${AWS_KEY_PREFIX:users/}
storage.s3.path-style-access=true
storage.s3.region=${AWS_REGION}
storage.s3.access-key=${AWS_ACCESS_KEY_ID}
storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
storage.s3.endpoint=${AWS_ENDPOINT}
